[pytest]
# Assignment 3 (Task 4): register the test groups (markers) used in assignment_tests/.
# The upstream cachetools project has no pytest configuration of its own, so this file
# only adds marker names; it does not change how the upstream tests in tests/ run.
markers =
    smoke: quick checks of the main behaviour of each method
    boundary: boundary-value-analysis cases (just below, on and just above a limit)
    data_driven: tests whose input and expected values are read from a CSV file
    lru: tests for LRUCache
    lfu: tests for LFUCache
    ttl: tests for TTLCache
